name: Sync formal WCT upstreams

on:
  pull_request:
    paths:
      - "data/formal-upstream-sync.json"
      - ".github/workflows/sync-formal-upstreams.yml"
  push:
    branches: [main]
    paths:
      - "data/formal-upstream-sync.json"
      - ".github/workflows/sync-formal-upstreams.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  WCT_SYMPY_REF: main

jobs:
  formal-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install PyYAML

      - name: Generate compiled registry and canonical equation explorer
        run: python scripts/build_equation_explorer.py

      - name: Preserve Lean definition coverage
        run: python scripts/patch_lean_definitions.py

      - name: Preserve canonical definitions and curate load-bearing objects
        run: python scripts/refine_equation_definitions.py

      - name: Generate SymPy equation cards
        run: python scripts/build_sympy_page.py

      - name: Generate Lean equation inspector
        run: python scripts/build_lean_page.py

      - name: Generate machine-readable research corpus
        run: python scripts/build_research_corpus.py

      - name: Validate formal registry synchronization
        run: python scripts/validate_registry_sync.py

      - name: Upload formal sync preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: formal-wct-upstream-sync-preview
          path: |
            data/formal-upstream-sync.json
            compiled-registry.json
            research-corpus.json
            registry-validation-report.json
            equations/equations.json
            equations/index.html
            sympy/index.html
            lean/index.html

      - name: Commit synchronized formal views
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -- compiled-registry.json research-corpus.json registry-validation-report.json equations/equations.json equations/index.html sympy/index.html lean/index.html
          if git diff --cached --quiet; then
            echo "No formal generated changes."
            exit 0
          fi
          git commit -m "Synchronize formal WCT upstream views"
          git push
