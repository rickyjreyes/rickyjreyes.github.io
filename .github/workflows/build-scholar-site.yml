name: Build scholarly publication pages

on:
  push:
    branches: [main]
    paths:
      - "data/publications.json"
      - "data/publication_traceability.json"
      - "overlap/overlap-data-*.js"
      - "scripts/build_scholar_site.py"
      - "scripts/build_equation_explorer.py"
      - "scripts/patch_lean_definitions.py"
      - "scripts/refine_equation_definitions.py"
      - "scripts/build_sympy_page.py"
      - "scripts/build_lean_page.py"
      - "scripts/build_research_corpus.py"
      - "scripts/build_external_convergence.py"
      - "scripts/validate_registry_sync.py"
      - "scripts/enhance_verification_views.py"
      - "scripts/optimize_math_rendering.py"
      - "scripts/patch_site_navigation.py"
      - "scripts/patch_machine_metadata.py"
      - "site-nav.js"
      - ".github/workflows/build-scholar-site.yml"
  pull_request:
    paths:
      - "data/publications.json"
      - "data/publication_traceability.json"
      - "overlap/overlap-data-*.js"
      - "scripts/build_scholar_site.py"
      - "scripts/build_equation_explorer.py"
      - "scripts/patch_lean_definitions.py"
      - "scripts/refine_equation_definitions.py"
      - "scripts/build_sympy_page.py"
      - "scripts/build_lean_page.py"
      - "scripts/build_research_corpus.py"
      - "scripts/build_external_convergence.py"
      - "scripts/validate_registry_sync.py"
      - "scripts/patch_site_navigation.py"
      - "scripts/patch_machine_metadata.py"
      - ".github/workflows/build-scholar-site.yml"
  workflow_dispatch:

permissions:
  contents: write

# Generated verification pages read the merged v5 canonical interoperability map
# from rickyjreyes/wct-sympy main, synchronized to the maintained 80-ID wct-lean inventory.
# Upstream sync checkpoint (2026-08-20):
#   wct-sympy 386309ebf60ab15a7b248841a4886ff3c8258458
#   wct-lean  ac7c59d661ec8d083f7359dc23fff5040d33a082
# Paper-level closure/DSI additions remain separate from canonical counts unless an exact mapping is added later.
env:
  WCT_SYMPY_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install PyYAML

      - name: Generate publication pages and metadata
        run: python scripts/build_scholar_site.py

      - name: Generate compiled registry and canonical equation explorer
        run: python scripts/build_equation_explorer.py

      - name: Preserve Lean definition coverage
        run: python scripts/patch_lean_definitions.py

      - name: Preserve canonical definitions and curate load-bearing objects
        run: python scripts/refine_equation_definitions.py

      - name: Generate SymPy equation cards
        run: python scripts/build_sympy_page.py

      - name: Generate Lean equation inspector
        run: python scripts/build_lean_page.py

      - name: Generate full machine-readable research corpus
        run: python scripts/build_research_corpus.py

      - name: Enhance verification views
        run: python scripts/enhance_verification_views.py

      - name: Optimize formula rendering
        run: python scripts/optimize_math_rendering.py

      - name: Apply shared navigation, traceability, and discovery patches
        run: python scripts/patch_site_navigation.py

      - name: Generate full machine-readable overlap ledger
        run: python scripts/build_external_convergence.py

      - name: Connect publication, claim, and priority metadata
        run: python scripts/patch_machine_metadata.py

      - name: Validate cross-layer registry and publication traceability
        run: python scripts/validate_registry_sync.py

      - name: Upload generated registry preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-wct-registry-preview
          path: |
            compiled-registry.json
            research-corpus.json
            registry-validation-report.json
            equations/equations.json
            equations/index.html
            sympy/index.html
            lean/index.html
            data/publication_traceability.json
            priority/external-convergence.json
            overlap/index.html
            publications/*.html

      - name: Commit generated files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate synchronized equation, publication traceability, and corpus views"
          git push
